[Timing]
; Seconds for the 13 save/load/settings UI waits. Default: 0.3.
; Range: 0 to 30. Use 3 for the original delay. Restart the game after editing.
; At 0, auto-dismiss notices use 0.001 seconds so they still close.
WaitSeconds=0.3

; Shared UI screen fades: 1 = original, 2 = twice as fast, 3 = three times.
; Range: 0.1 to 20. Instant transitions stay instant. Restart after editing.
FadeSpeed=2.0

; Loading narrative only (common messages 88..95): 1=original, 4=normal text speed.
; Range: 0.1 to 20. Does not change other dialogue or the post-text hold.
RecapTextSpeed=4.0
; Partner-switch screen effect only: 1=original, 2=twice as fast.
; Range: 0.1 to 20. The original transition readiness checks remain active.
PartnerTransitionSpeed=2.0

; Save-slot typewriter text only: 1=original, 4=four times as fast.
; Range: 0.1 to 20. Other UI text is unchanged. Typing sounds play normally, with fewer triggers.
SaveTextSpeed=4.0
; Hold after the saved slot finishes typing, in seconds. Original: 2.
; Range: 0 to 30. 0 returns on the next UI update. Restart after editing.
SaveTextHoldSeconds=0.3

[Typewriter]
; 1 = skip the typewriter introduction and show the choices right away.
; Without choices (no ink ribbon) the message is skipped. With re0box active,
; no ink ribbon opens the item box directly. 0 = original. Restart after editing.
SkipTypewriterMessage=1
